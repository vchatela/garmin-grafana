# Fork-only: builds the `homelab` branch (upstream main plus open PRs not yet released)
# into ghcr.io/vchatela/garmin-fetch-data, for use until upstream ships them.
name: Fork image

on:
  push:
    branches:
      - homelab
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ github.repository == 'vchatela/garmin-grafana' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag
        id: tag
        run: echo "tag=homelab-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vchatela/garmin-fetch-data:${{ steps.tag.outputs.tag }}
            ghcr.io/vchatela/garmin-fetch-data:homelab

      - name: Digest
        run: echo "ghcr.io/vchatela/garmin-fetch-data:${{ steps.tag.outputs.tag }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
